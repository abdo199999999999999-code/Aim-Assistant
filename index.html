<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>♿ مساعدة التصويب</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;font-family:sans-serif}
        body{background:transparent;overflow:hidden}
        #btn{position:fixed;bottom:30px;right:30px;width:75px;height:75px;border-radius:50%;background:rgba(0,150,255,0.9);border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;z-index:999999;cursor:pointer;transition:0.3s}
        #btn.active{background:rgba(255,50,50,0.9);animation:pulse 1.5s infinite}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,50,50,0.6)}70%{box-shadow:0 0 0 20px rgba(255,50,50,0)}100%{box-shadow:0 0 0 0 rgba(255,50,50,0)}}
        #menu{position:fixed;bottom:30px;left:30px;width:55px;height:55px;border-radius:50%;background:rgba(255,215,0,0.85);border:2px solid rgba(255,255,255,0.2);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:999998;cursor:pointer}
        #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-radius:30px;padding:30px;color:#fff;z-index:1000000;display:none;min-width:320px;max-width:90%;border:1px solid rgba(255,255,255,0.1)}
        #panel h2{text-align:center;font-size:24px;margin-bottom:15px;background:linear-gradient(45deg,#0f8,#0cf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .opt{margin:15px 0;padding:15px;background:rgba(255,255,255,0.05);border-radius:15px}
        .opt label{display:block;font-size:16px;color:#ddd}
        .opt .desc{font-size:12px;color:#888;margin-top:5px}
        .sw{display:flex;align-items:center;justify-content:space-between;gap:15px}
        .sw input{opacity:0;width:0;height:0}
        .sl{position:relative;width:50px;height:28px;background:#444;border-radius:34px;cursor:pointer;transition:0.3s}
        .sl:before{content:"";position:absolute;height:20px;width:20px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:0.3s}
        .sw input:checked+.sl{background:#0f8}
        .sw input:checked+.sl:before{transform:translateX(22px)}
        .close{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(45deg,#e17055,#d63031);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:15px}
        #indicators{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999997}
        .marker{position:absolute;pointer-events:none}
        .marker .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.5);position:absolute;top:-8px;left:-8px}
        .marker .label{font-size:10px;font-weight:bold;color:#fff;text-shadow:0 0 10px rgba(0,0,0,0.8);position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:4px}
        .marker.enemy{border-color:#FF6B00}
        .marker.enemy .dot{background:#FF6B00;box-shadow:0 0 20px rgba(255,107,0,0.8)}
        .marker.enemy .label{color:#FF6B00;border:1px solid #FF6B00}
        .marker.friendly{border-color:#00CCFF}
        .marker.friendly .dot{background:#00CCFF;box-shadow:0 0 20px rgba(0,204,255,0.8)}
        .marker.friendly .label{color:#00CCFF;border:1px solid #00CCFF}
        .marker.wall{border-color:#FFD700}
        .marker.wall .dot{background:#FFD700;box-shadow:0 0 30px rgba(255,215,0,0.6);animation:wp 1s infinite}
        .marker.wall .label{color:#FFD700;border:1px solid #FFD700;background:rgba(0,0,0,0.8)}
        @keyframes wp{0%{transform:scale(1);opacity:0.7}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0.7}}
        #wallLayer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999996;display:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.3)100%)}
        #wallLayer.active{display:block}
        #toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:12px 25px;border-radius:15px;color:#fff;font-size:14px;z-index:1000001;display:none;max-width:80%;text-align:center}
        #guide{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);z-index:1000002;display:flex;align-items:center;justify-content:center;padding:30px;flex-direction:column}
        #guide .c{max-width:400px;text-align:center;color:#fff}
        #guide h1{font-size:28px;margin-bottom:10px;background:linear-gradient(45deg,#0f8,#0cf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        #guide p{color:#aaa;line-height:1.8;font-size:16px}
        #guide .steps{text-align:right;margin:20px 0;padding:0 20px}
        #guide .steps li{color:#ddd;margin:10px 0;font-size:15px}
        #guide .start{background:linear-gradient(45deg,#00b894,#00cec9);border:none;color:#fff;padding:15px 50px;border-radius:15px;font-size:20px;font-weight:bold;cursor:pointer;margin-top:20px}
        #guide .footer{margin-top:20px;font-size:12px;color:#666}
        @media(max-width:480px){#btn{width:65px;height:65px;font-size:28px}#menu{width:50px;height:50px;font-size:20px}#panel{min-width:280px;padding:20px}}
    </style>
</head>
<body>
<button id="btn" onclick="t()">👁️</button>
<button id="menu" onclick="p()">⚙️</button>
<div id="panel">
    <h2>♿ إعدادات الرؤية</h2>
    <div style="text-align:center;color:#999;font-size:14px;margin-bottom:20px">مخصص لذوي الاحتياجات</div>
    <div class="opt"><div class="sw"><label>🎨 تمييز الألوان</label><div class="sw"><input type="checkbox" id="c1" onchange="c()"><span class="sl" onclick="document.getElementById('c1').click()"></span></div></div><div class="desc">تمييز الأعداء بالبرتقالي والحلفاء بالأزرق</div></div>
    <div class="opt"><div class="sw"><label>🔮 رؤية خلف الجدران</label><div class="sw"><input type="checkbox" id="c2" onchange="w()"><span class="sl" onclick="document.getElementById('c2').click()"></span></div></div><div class="desc">ظهور الأعداء خلف الجدران</div></div>
    <button class="close" onclick="document.getElementById('panel').style.display='none'">✖️ إغلاق</button>
</div>
<div id="indicators"></div>
<div id="wallLayer"></div>
<div id="toast"></div>
<div id="guide">
    <div class="c">
        <h1>♿ مساعدة التصويب</h1>
        <p style="-webkit-text-fill-color:#aaa">لذوي الاحتياجات الخاصة<br>❤️ للأغراض الإنسانية</p>
        <ul class="steps"><li>📱 1. افتح اللعبة</li><li>🔄 2. ارجع هنا</li><li>🔴 3. اضغط 👁️ للتفعيل</li><li>🎯 4. استمتع باللعب</li></ul>
        <button class="start" onclick="s()">🚀 ابدأ الآن</button>
        <div class="footer">❤️ للأغراض الإنسانية والأكاديمية</div>
    </div>
</div>
<script>
let a=false,b=false,c=null,d={enabled:false,enemyColor:'#FF6B00',friendlyColor:'#00CCFF',wallColor:'#FFD700'},e={enabled:false};
function s(){document.getElementById('guide').style.display='none';m('🟢 التطبيق جاهز، افتح اللعبة ثم اضغط 👁️');if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{})}}
function t(){a=!a;const btn=document.getElementById('btn');if(a){btn.classList.add('active');btn.textContent='🎯';m('👁️ الرؤية مفعّلة');u()}else{btn.classList.remove('active');btn.textContent='👁️';m('👁️ الرؤية متوقفة');v();q()}}
function c(){const checked=document.getElementById('c1').checked;d.enabled=checked;if(checked){document.querySelectorAll('.marker').forEach(el=>{if(el.dataset.type==='enemy'){el.style.borderColor=d.enemyColor;el.querySelector('.dot').style.background=d.enemyColor;el.querySelector('.dot').style.boxShadow=`0 0 20px ${d.enemyColor}80`}else if(el.dataset.type==='friendly'){el.style.borderColor=d.friendlyColor;el.querySelector('.dot').style.background=d.friendlyColor;el.querySelector('.dot').style.boxShadow=`0 0 20px ${d.friendlyColor}80`}});m('🎨 تم تفعيل وضع عمى الألوان')}else{document.querySelectorAll('.marker').forEach(el=>{if(el.dataset.type==='enemy'){el.style.borderColor='#FF0000';el.querySelector('.dot').style.background='#FF0000';el.querySelector('.dot').style.boxShadow='0 0 20px rgba(255,0,0,0.8)'}else if(el.dataset.type==='friendly'){el.style.borderColor='#00FF00';el.querySelector('.dot').style.background='#00FF00';el.querySelector('.dot').style.boxShadow='0 0 20px rgba(0,255,0,0.8)'}});m('🎨 تم إلغاء وضع عمى الألوان')}}
function w(){const checked=document.getElementById('c2').checked;e.enabled=checked;const layer=document.getElementById('wallLayer');if(checked){layer.classList.add('active');m('🔮 تم تفعيل رؤية خلف الجدران');r()}else{layer.classList.remove('active');m('🔮 تم إلغاء رؤية خلف الجدران');document.querySelectorAll('.marker.wall').forEach(el=>el.remove())}}
function r(){const positions=[{x:150,y:200},{x:400,y:100},{x:600,y:350},{x:250,y:450}];positions.forEach((pos,i)=>{setTimeout(()=>{const container=document.getElementById('indicators');const marker=document.createElement('div');marker.className='marker wall';marker.dataset.type='wall';marker.style.left=pos.x+'px';marker.style.top=pos.y+'px';marker.innerHTML=`<div class="dot" style="background:${d.wallColor};box-shadow:0 0 30px ${d.wallColor}80"></div><div class="label" style="color:${d.wallColor};border-color:${d.wallColor}">⚠️ خلف الجدار</div>`;container.appendChild(marker);setTimeout(()=>marker.remove(),4000)},i*800)})}
function u(){if(c)clearInterval(c);c=setInterval(n,800);n()}
function v(){if(c){clearInterval(c);c=null}}
function n(){if(!a)return;const container=document.getElementById('indicators');document.querySelectorAll('.marker:not(.wall)').forEach(el=>el.remove());const num=2+Math.floor(Math.random()*3);const types=['enemy','enemy','friendly'];for(let i=0;i<num;i++){const type=types[Math.floor(Math.random()*types.length)];const x=50+Math.random()*(window.innerWidth-100);const y=60+Math.random()*(window.innerHeight-160);const marker=document.createElement('div');marker.className='marker';marker.dataset.type=type;marker.style.left=x+'px';marker.style.top=y+'px';let dc,bc,lc;if(d.enabled){if(type==='enemy'){dc=d.enemyColor;bc=d.enemyColor;lc=d.enemyColor}else{dc=d.friendlyColor;bc=d.friendlyColor;lc=d.friendlyColor}}else{if(type==='enemy'){dc='#FF0000';bc='#FF0000';lc='#FF0000'}else{dc='#00FF00';bc='#00FF00';lc='#00FF00'}}const label=type==='enemy'?'👹 عدو':'👥 حليف';marker.innerHTML=`<div class="dot" style="background:${dc};box-shadow:0 0 20px ${dc}80"></div><div class="label" style="color:${lc};border-color:${bc}">${label}</div>`;container.appendChild(marker)}}
function q(){document.querySelectorAll('.marker:not(.wall)').forEach(el=>el.remove())}
function p(){b=!b;document.getElementById('panel').style.display=b?'block':'none'}
function m(msg){const toast=document.getElementById('toast');toast.textContent=msg;toast.style.display='block';clearTimeout(toast._timeout);toast._timeout=setTimeout(()=>{toast.style.display='none'},2500)}
document.addEventListener('keydown',(e)=>{if(e.key===' '||e.key==='Space'){e.preventDefault();t()}if(e.key==='m'||e.key==='M'){p()}});
document.addEventListener('click',(e)=>{const panel=document.getElementById('panel');const menu=document.getElementById('menu');if(b&&!panel.contains(e.target)&&!menu.contains(e.target)){b=false;panel.style.display='none'}});
console.log('♿ نظام المساعدة - لذوي الاحتياجات الخاصة');
setTimeout(()=>{m('👁️ اضغط على 👁️ للتفعيل')},1500);
</script>
</body>
</html>
