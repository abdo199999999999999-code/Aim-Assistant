<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>♿ مساعدة التصويب</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;font-family:sans-serif}
        body{background:transparent;overflow:hidden}
        #mainBtn{position:fixed;bottom:30px;right:30px;width:75px;height:75px;border-radius:50%;background:rgba(0,150,255,0.9);border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;z-index:999999;cursor:pointer;transition:0.3s;box-shadow:0 4px 25px rgba(0,150,255,0.5)}
        #mainBtn:active{transform:scale(0.85)}
        #mainBtn.active{background:rgba(255,50,50,0.9);box-shadow:0 4px 30px rgba(255,50,50,0.6);animation:pulse 1.5s infinite}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,50,50,0.6)}70%{box-shadow:0 0 0 20px rgba(255,50,50,0)}100%{box-shadow:0 0 0 0 rgba(255,50,50,0)}}
        #menuBtn{position:fixed;bottom:30px;left:30px;width:55px;height:55px;border-radius:50%;background:rgba(255,215,0,0.85);border:2px solid rgba(255,255,255,0.2);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:999998;cursor:pointer;box-shadow:0 4px 20px rgba(255,215,0,0.3)}
        #menuBtn:active{transform:scale(0.85)}
        #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:30px;padding:30px;color:#fff;z-index:1000000;display:none;min-width:320px;max-width:90%;border:1px solid rgba(255,255,255,0.1)}
        #panel h2{text-align:center;font-size:24px;margin-bottom:15px;background:linear-gradient(45deg,#0f8,#0cf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .opt{margin:15px 0;padding:15px;background:rgba(255,255,255,0.05);border-radius:15px}
        .opt label{display:block;font-size:16px;color:#ddd}
        .opt .desc{font-size:12px;color:#888;margin-top:5px}
        .sw{display:flex;align-items:center;justify-content:space-between;gap:15px}
        .sw input{opacity:0;width:0;height:0}
        .sl{position:relative;width:50px;height:28px;background:#444;border-radius:34px;cursor:pointer;transition:0.3s}
        .sl:before{content:"";position:absolute;height:20px;width:20px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:0.3s}
        .sw input:checked+.sl{background:#0f8}
        .sw input:checked+.sl:before{transform:translateX(22px)}
        .close{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(45deg,#e17055,#d63031);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:15px}
        #indicators{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999997}
        .marker{position:absolute;pointer-events:none}
        .marker .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.5);position:absolute;top:-8px;left:-8px}
        .marker .label{font-size:10px;font-weight:bold;color:#fff;text-shadow:0 0 10px rgba(0,0,0,0.8);position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:4px}
        .marker.enemy{border-color:#FF6B00}
        .marker.enemy .dot{background:#FF6B00;box-shadow:0 0 20px rgba(255,107,0,0.8)}
        .marker.enemy .label{color:#FF6B00;border:1px solid #FF6B00}
        .marker.friendly{border-color:#00CCFF}
        .marker.friendly .dot{background:#00CCFF;box-shadow:0 0 20px rgba(0,204,255,0.8)}
        .marker.friendly .label{color:#00CCFF;border:1px solid #00CCFF}
        .marker.wall{border-color:#FFD700}
        .marker.wall .dot{background:#FFD700;box-shadow:0 0 30px rgba(255,215,0,0.6);animation:wp 1s infinite}
        .marker.wall .label{color:#FFD700;border:1px solid #FFD700;background:rgba(0,0,0,0.8)}
        @keyframes wp{0%{transform:scale(1);opacity:0.7}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0.7}}
        #wallLayer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999996;display:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.3)100%)}
        #wallLayer.active{display:block}
        #toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:12px 25px;border-radius:15px;color:#fff;font-size:14px;z-index:1000001;display:none;max-width:80%;text-align:center}
        #guide{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:1000002;display:flex;align-items:center;justify-content:center;padding:30px;flex-direction:column}
        #guide .c{max-width:400px;text-align:center;color:#fff}
        #guide h1{font-size:28px;margin-bottom:10px;background:linear-gradient(45deg,#0f8,#0cf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        #guide p{color:#aaa;line-height:1.8;font-size:16px}
        #guide .steps{text-align:right;margin:20px 0;padding:0 20px}
        #guide .steps li{color:#ddd;margin:10px 0;font-size:15px}
        #guide .start{background:linear-gradient(45deg,#00b894,#00cec9);border:none;color:#fff;padding:15px 50px;border-radius:15px;font-size:20px;font-weight:bold;cursor:pointer;margin-top:20px}
        #guide .footer{margin-top:20px;font-size:12px;color:#666}
        @media(max-width:480px){#mainBtn{width:65px;height:65px;font-size:28px}#menuBtn{width:50px;height:50px;font-size:20px}#panel{min-width:280px;padding:20px}}
    </style>
</head>
<body>

<!-- الأزرار الرئيسية -->
<button id="mainBtn">👁️</button>
<button id="menuBtn">⚙️</button>

<!-- لوحة الإعدادات -->
<div id="panel">
    <h2>♿ إعدادات الرؤية</h2>
    <div style="text-align:center;color:#999;font-size:14px;margin-bottom:20px">مخصص لذوي الاحتياجات</div>
    <div class="opt"><div class="sw"><label>🎨 تمييز الألوان</label><div class="sw"><input type="checkbox" id="c1"><span class="sl" onclick="document.getElementById('c1').click()"></span></div></div><div class="desc">تمييز الأعداء بالبرتقالي والحلفاء بالأزرق</div></div>
    <div class="opt"><div class="sw"><label>🔮 رؤية خلف الجدران</label><div class="sw"><input type="checkbox" id="c2"><span class="sl" onclick="document.getElementById('c2').click()"></span></div></div><div class="desc">ظهور الأعداء خلف الجدران</div></div>
    <button class="close" onclick="document.getElementById('panel').style.display='none'">✖️ إغلاق</button>
</div>

<!-- مؤشرات اللاعبين -->
<div id="indicators"></div>
<div id="wallLayer"></div>
<div id="toast"></div>

<!-- صفحة الترحيب -->
<div id="guide">
    <div class="c">
        <h1>♿ مساعدة التصويب</h1>
        <p style="-webkit-text-fill-color:#aaa">لذوي الاحتياجات الخاصة<br>❤️ للأغراض الإنسانية</p>
        <ul class="steps"><li>📱 1. افتح اللعبة</li><li>🔄 2. ارجع هنا</li><li>🔴 3. اضغط 👁️ للتفعيل</li><li>🎯 4. استمتع باللعب</li></ul>
        <button class="start" id="startBtn">🚀 ابدأ الآن</button>
        <div class="footer">❤️ للأغراض الإنسانية والأكاديمية</div>
    </div>
</div>

<script>
// استخدام window.onload لضمان تحميل كل العناصر أولاً
window.onload = function() {
    // ===== المتغيرات =====
    var aimActive = false;
    var panelOpen = false;
    var scanInterval = null;
    var colorBlindMode = false;
    var wallVisionMode = false;
    
    // ===== العناصر =====
    var guide = document.getElementById('guide');
    var mainBtn = document.getElementById('mainBtn');
    var menuBtn = document.getElementById('menuBtn');
    var panel = document.getElementById('panel');
    var toast = document.getElementById('toast');
    var startBtn = document.getElementById('startBtn');
    var indicators = document.getElementById('indicators');
    var wallLayer = document.getElementById('wallLayer');
    var c1 = document.getElementById('c1');
    var c2 = document.getElementById('c2');
    
    // ===== دالة عرض الرسائل =====
    function showToast(msg) {
        toast.textContent = msg;
        toast.style.display = 'block';
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(function() {
            toast.style.display = 'none';
        }, 2500);
    }
    
    // ===== دالة تشغيل الرؤية =====
    function toggleVision() {
        aimActive = !aimActive;
        if (aimActive) {
            mainBtn.classList.add('active');
            mainBtn.textContent = '🎯';
            showToast('👁️ الرؤية مفعّلة');
            startScanning();
        } else {
            mainBtn.classList.remove('active');
            mainBtn.textContent = '👁️';
            showToast('👁️ الرؤية متوقفة');
            stopScanning();
            clearIndicators();
        }
    }
    
    // ===== دالة بدء المسح =====
    function startScanning() {
        if (scanInterval) clearInterval(scanInterval);
        scanInterval = setInterval(updatePlayers, 800);
        updatePlayers();
    }
    
    function stopScanning() {
        if (scanInterval) {
            clearInterval(scanInterval);
            scanInterval = null;
        }
    }
    
    // ===== تحديث اللاعبين =====
    function updatePlayers() {
        if (!aimActive) return;
        // مسح المؤشرات القديمة (ما عدا wall)
        var oldMarkers = indicators.querySelectorAll('.marker:not(.wall)');
        for (var i = 0; i < oldMarkers.length; i++) {
            oldMarkers[i].remove();
        }
        
        var numPlayers = 2 + Math.floor(Math.random() * 3);
        var types = ['enemy', 'enemy', 'friendly'];
        for (var i = 0; i < numPlayers; i++) {
            var type = types[Math.floor(Math.random() * types.length)];
            var x = 50 + Math.random() * (window.innerWidth - 100);
            var y = 60 + Math.random() * (window.innerHeight - 160);
            
            var marker = document.createElement('div');
            marker.className = 'marker';
            marker.dataset.type = type;
            marker.style.left = x + 'px';
            marker.style.top = y + 'px';
            
            var dotColor, borderColor, labelColor;
            if (colorBlindMode) {
                if (type === 'enemy') {
                    dotColor = '#FF6B00';
                    borderColor = '#FF6B00';
                    labelColor = '#FF6B00';
                } else {
                    dotColor = '#00CCFF';
                    borderColor = '#00CCFF';
                    labelColor = '#00CCFF';
                }
            } else {
                if (type === 'enemy') {
                    dotColor = '#FF0000';
                    borderColor = '#FF0000';
                    labelColor = '#FF0000';
                } else {
                    dotColor = '#00FF00';
                    borderColor = '#00FF00';
                    labelColor = '#00FF00';
                }
            }
            var label = type === 'enemy' ? '👹 عدو' : '👥 حليف';
            marker.innerHTML = '<div class="dot" style="background:' + dotColor + ';box-shadow:0 0 20px ' + dotColor + '80;"></div><div class="label" style="color:' + labelColor + ';border-color:' + borderColor + ';">' + label + '</div>';
            indicators.appendChild(marker);
        }
    }
    
    function clearIndicators() {
        var allMarkers = indicators.querySelectorAll('.marker:not(.wall)');
        for (var i = 0; i < allMarkers.length; i++) {
            allMarkers[i].remove();
        }
    }
    
    // ===== تمييز الألوان =====
    c1.onchange = function() {
        colorBlindMode = c1.checked;
        if (colorBlindMode) {
            showToast('🎨 تم تفعيل وضع عمى الألوان');
        } else {
            showToast('🎨 تم إلغاء وضع عمى الألوان');
        }
        // تحديث المؤشرات
        var markers = indicators.querySelectorAll('.marker');
        for (var i = 0; i < markers.length; i++) {
            var el = markers[i];
            if (el.dataset.type === 'enemy') {
                var color = colorBlindMode ? '#FF6B00' : '#FF0000';
                el.style.borderColor = color;
                el.querySelector('.dot').style.background = color;
                el.querySelector('.dot').style.boxShadow = '0 0 20px ' + color + '80';
            } else if (el.dataset.type === 'friendly') {
                var color2 = colorBlindMode ? '#00CCFF' : '#00FF00';
                el.style.borderColor = color2;
                el.querySelector('.dot').style.background = color2;
                el.querySelector('.dot').style.boxShadow = '0 0 20px ' + color2 + '80';
            }
        }
    };
    
    // ===== رؤية خلف الجدران =====
    c2.onchange = function() {
        wallVisionMode = c2.checked;
        if (wallVisionMode) {
            wallLayer.classList.add('active');
            showToast('🔮 تم تفعيل رؤية خلف الجدران');
            showWallEnemies();
        } else {
            wallLayer.classList.remove('active');
            showToast('🔮 تم إلغاء رؤية خلف الجدران');
            var wallMarkers = indicators.querySelectorAll('.marker.wall');
            for (var i = 0; i < wallMarkers.length; i++) {
                wallMarkers[i].remove();
            }
        }
    };
    
    function showWallEnemies() {
        var positions = [
            {x: 150, y: 200},
            {x: 400, y: 100},
            {x: 600, y: 350},
            {x: 250, y: 450}
        ];
        for (var i = 0; i < positions.length; i++) {
            (function(index) {
                setTimeout(function() {
                    var pos = positions[index];
                    var marker = document.createElement('div');
                    marker.className = 'marker wall';
                    marker.dataset.type = 'wall';
                    marker.style.left = pos.x + 'px';
                    marker.style.top = pos.y + 'px';
                    marker.innerHTML = '<div class="dot" style="background:#FFD700;box-shadow:0 0 30px #FFD70080;"></div><div class="label" style="color:#FFD700;border-color:#FFD700;">⚠️ خلف الجدار</div>';
                    indicators.appendChild(marker);
                    setTimeout(function() { marker.remove(); }, 4000);
                }, index * 800);
            })(i);
        }
    }
    
    // ===== القائمة =====
    menuBtn.onclick = function() {
        panelOpen = !panelOpen;
        panel.style.display = panelOpen ? 'block' : 'none';
    };
    
    // ===== زر "ابدأ الآن" =====
    startBtn.onclick = function() {
        guide.style.display = 'none';
        showToast('🟢 التطبيق جاهز، افتح اللعبة ثم اضغط 👁️');
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(function() {});
        }
        // طلب صلاحية العرض فوق التطبيقات
        if (window.Android && window.Android.requestOverlayPermission) {
            window.Android.requestOverlayPermission();
        } else {
            showToast('⚠️ يرجى منح صلاحية "العرض فوق التطبيقات"');
        }
    };
    
    // ===== زر التفعيل الرئيسي =====
    mainBtn.onclick = toggleVision;
    
    // ===== إغلاق القائمة بالنقر خارجها =====
    document.addEventListener('click', function(e) {
        if (panelOpen && !panel.contains(e.target) && !menuBtn.contains(e.target)) {
            panelOpen = false;
            panel.style.display = 'none';
        }
    });
    
    // ===== دعم لوحة المفاتيح =====
    document.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            toggleVision();
        }
        if (e.key === 'm' || e.key === 'M') {
            menuBtn.click();
        }
    });
    
    console.log('♿ نظام المساعدة - لذوي الاحتياجات الخاصة (نسخة متوافقة مع جميع المتصفحات)');
    setTimeout(function() {
        showToast('👁️ اضغط على 👁️ للتفعيل');
    }, 1500);
};
</script>

</body>
</html>
